[package]
name = "wordcraft-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft import/export: plain text, Markdown, HTML, RTF, OpenDocument Text and LaTeX"

[lints]
workspace = true

[features]
default = ["write", "odt", "latex", "math", "sheet", "full-codecs"]
write = []
odt = ["dep:craft-odf"]
latex = ["dep:craft-latex", "math"]
math = ["dep:craft-math", "wordcraft-doc/math"]
sheet = ["dep:craft-sheet", "dep:craft-ods", "dep:craft-xls", "dep:craft-xlsx"]
full-codecs = ["wordcraft-geom/image"]
# `sheet::xls_fixture`, the binary workbook builder other crates' tests share; turned on only as a
# dev-dependency, so never built into the app.
test-support = ["craft-xls/test-support"]

[dependencies]
wordcraft-doc = { path = "../doc", default-features = false }
wordcraft-docx = { path = "../docx", default-features = false }
craft-wordmodel = { workspace = true }
craft-rtf = { workspace = true }
craft-flow = { workspace = true }
craft-odf = { workspace = true, optional = true }
craft-markdown = { workspace = true }
craft-html = { workspace = true }
craft-latex = { workspace = true, optional = true }
craft-math = { workspace = true, optional = true }
craft-mime = { workspace = true }
craft-sheet = { workspace = true, optional = true }
craft-ods = { workspace = true, optional = true }
craft-xls = { workspace = true, optional = true }
craft-xlsx = { workspace = true, optional = true }
craft-zip = { workspace = true }
wordcraft-geom = { path = "../geom", features = ["slim-image"] }
craft-metafile = { workspace = true }
encoding_rs = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
# Password-protected ODT (ODF 1.3 Part 2 §3.4): AES-256-CBC, SHA-1/SHA-256, PBKDF2 (HMAC-SHA-1).
[dev-dependencies]
wordcraft-doc = { workspace = true, features = ["test-support"] }
craft-image-codecs = { workspace = true }
proptest = { workspace = true }
chardetng = { workspace = true }
