[package]
name = "wordcraft-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft layout: shaping, line breaking, tabs, lists, tables, pagination, headers/footers, hit testing"

[lints]
workspace = true

[features]
default = ["math", "proofing", "full-codecs", "all-fonts"]
math = ["wordcraft-doc/math", "wordcraft-fonts/math"]
proofing = ["dep:wordcraft-proof"]
full-codecs = ["wordcraft-geom/image"]
all-fonts = ["wordcraft-fonts/all-fonts"]

[dependencies]
wordcraft-geom = { path = "../geom", features = ["slim-image"] }
wordcraft-doc = { path = "../doc", default-features = false }
wordcraft-fonts = { path = "../fonts", default-features = false }
wordcraft-proof = { workspace = true, optional = true }
craft-metafile = { workspace = true }
kurbo = { workspace = true }
unicode-bidi = { workspace = true }
unicode-linebreak = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
wordcraft-doc = { workspace = true, features = ["test-support"] }
wordcraft-fonts = { workspace = true, features = ["test-support"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock (`SystemTime::now()`/`Instant::now()` panic on wasm32-unknown-unknown).
js-sys = "0.3"
