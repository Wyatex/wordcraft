[package]
name = "wordcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft engine: session, selection, undo, the command registry (every action is a command), Word's command catalog, file I/O dispatch"

[lints]
workspace = true

[features]
default = ["full"]
full = [
    "editing", "math", "proofing", "pdf", "odt", "latex", "sheet", "write",
    "wordcraft-geom/image", "wordcraft-fonts/all-fonts", "wordcraft-layout/full-codecs",
    "wordcraft-render/full-codecs", "wordcraft-formats/full-codecs",
]
editing = ["dep:image", "dep:craft-ssip"]
math = ["wordcraft-doc/math", "wordcraft-fonts/math", "wordcraft-layout/math", "wordcraft-formats/math"]
proofing = ["dep:wordcraft-proof", "wordcraft-layout/proofing", "wordcraft-fonts/download", "dep:craft-font-store", "dep:craft-font-catalog"]
pdf = ["dep:wordcraft-pdf"]
odt = ["wordcraft-formats/odt"]
latex = ["wordcraft-formats/latex"]
sheet = ["wordcraft-formats/sheet"]
write = ["wordcraft-docx/write", "wordcraft-formats/write"]
# Front-end producer tests need to simulate a globally exhausted IME revision allocator. It only
# ever makes receipt classification fail closed. Never enable this for a production build; the
# UI's dev-dependencies enable it for its tests.
test-support = []

[dependencies]
craft-mime.workspace = true
craft-keymap.workspace = true
craft-codepage.workspace = true
wordcraft-geom = { path = "../geom", features = ["slim-image"] }
wordcraft-doc = { path = "../doc", default-features = false }
wordcraft-fonts = { path = "../fonts", default-features = false }
wordcraft-layout = { path = "../layout", default-features = false }
wordcraft-render = { path = "../render", default-features = false }
wordcraft-proof = { workspace = true, optional = true }
wordcraft-docx = { path = "../docx", default-features = false }
wordcraft-docbin = { workspace = true }
wordcraft-pdf = { workspace = true, optional = true }
wordcraft-formats = { path = "../formats", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
regex-automata = { workspace = true }
image = { workspace = true, optional = true }
zeroize = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser clock for `now_iso` (`SystemTime::now()` panics on wasm32-unknown-unknown).
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
# Language packs (CP4.3): downloaded, verified and unpacked by the suite's font store.
craft-font-store = { workspace = true, optional = true }
craft-font-catalog = { workspace = true, optional = true }
# The local time zone's offset for Insert ▸ Date & Time and date fields (#1707); the web asks the browser's Date.
chrono = { workspace = true, features = ["clock"] }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
# Speech Dispatcher's wire framing for Read Aloud (speech/ssip.rs).
craft-ssip = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK, so a path swapped for a named pipe can't block `open` (#3666).
libc = { workspace = true }

# A plain fsync where a file system refuses the full flush (`sync_file`, safe_save.rs).
# Already in Cargo.lock on Apple targets (craft-atomic), so this adds no new crate.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
wordcraft-doc = { workspace = true, features = ["test-support"] }
wordcraft-formats = { workspace = true, features = ["test-support"] }
encoding_rs = { workspace = true }
craft-zip = { workspace = true }
cfb = { workspace = true }
