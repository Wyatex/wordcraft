[package]
name = "wordcraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[features]
default = ["full-codecs", "all-fonts"]
full-codecs = ["wordcraft-geom/image", "wordcraft-layout/full-codecs"]
all-fonts = ["wordcraft-fonts/all-fonts", "wordcraft-layout/all-fonts"]

[dependencies]
wordcraft-geom = { path = "../geom", features = ["slim-image"] }
wordcraft-doc = { path = "../doc", default-features = false }
wordcraft-fonts = { path = "../fonts", default-features = false }
wordcraft-layout = { path = "../layout", default-features = false }
craft-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
